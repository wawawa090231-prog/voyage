<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>學習歷程島｜蘭嶼高中</title>
<meta name="description" content="蘭嶼高中學習歷程撰寫技巧闖關：划著拼板舟繞過五座島，答對題目收集飛魚。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 40 28" width="30" height="22"><path d="M3 12 Q6 24 20 24 Q34 24 37 12 Q20 16 3 12Z M3 12 L1 3 L6 11Z M37 12 L39 3 L34 11Z" fill="#fff"/><path d="M8 17 L12 15 L16 17 L20 15 L24 17 L28 15 L32 17" fill="none" stroke="#e0575a" stroke-width="1.8"/></svg>
    </span>
    <div><b>學習歷程島</b><small>蘭嶼高中・學習歷程撰寫技巧闖關</small></div>
  </div>
  <div class="tb-right">
    <span class="pill star" id="tbStar">★ 0</span>
    <button class="pill" id="musicBtn" aria-pressed="false">♪ 開啟音樂</button>
    <button class="pill" id="menuBtn" aria-expanded="false" aria-controls="menu">選單</button>
  </div>
  <div class="menu" id="menu" hidden>
    <button data-act="crew">更換航海員</button>
    <button data-act="fish">飛魚收藏</button>
    <button data-act="check">上傳前檢核表</button>
    <button data-act="cert">航海證書</button>
    <button data-act="intro">再看一次開場</button>
    <button data-act="reset" class="danger">重新開始航行</button>
  </div>
</header>

<main class="layout">
  <section class="stage" id="stage" aria-label="3D 群島地圖">
    <canvas id="sea"></canvas>
    <div class="labels" id="labels"></div>
    <div class="stagecard">
      <small>3D LEARNING PORTFOLIO</small>
      <b>學習歷程群島</b>
      <span id="scProg">0 / 9 關</span>
    </div>
    <div class="hint" id="hint">拖曳可以旋轉，滾輪或雙指可以縮放，點一座島就能前往</div>
    <div class="zoombar" id="zoombar">
      <button id="zReset" aria-label="回到目前位置" title="回到目前位置">⟲</button>
      <button id="zOut" aria-label="縮小">−</button>
      <span id="zPct">50%</span>
      <button id="zIn" aria-label="放大">＋</button>
      <button id="zAll" class="wide">全覽</button>
    </div>
    <div class="nogl" id="nogl" hidden>這台裝置無法顯示 3D 地圖，仍然可以用清單闖關。</div>
  </section>

  <aside class="panel" id="panel">
    <div class="crew">
      <div class="avatar"><img id="avatar" alt=""></div>
      <div class="cinfo"><b id="crewName">還沒有航海員</b><small id="crewSub"></small></div>
      <button class="btn sm" id="crewBtn">建立航海員</button>
    </div>

    <div class="prog">
      <div class="prow"><span>航行進度</span><b id="pLv">0 / 9 關</b><b class="gold" id="pStar">★ 0/27</b></div>
      <div class="pbar"><span id="pBar"></span></div>
    </div>

    <div class="ichips" id="ichips" role="tablist" aria-label="五座島"></div>
    <div class="ilist" id="ilist"></div>

    <div class="pbtns">
      <button class="tile" id="fishBtn">🐟 飛魚收藏</button>
      <button class="tile" id="checkBtn">✅ 上傳前檢核表</button>
      <button class="tile" id="certBtn">📜 航海證書</button>
    </div>
    <p class="credit">內容整理自《學習歷程撰寫技巧講義》（2026.11.5）。改寫範例為講義自擬的示範。進度只存在這台裝置的瀏覽器裡。</p>
  </aside>
</main>

<div class="overlay" id="ov" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <div class="bar"><b id="dTitle"></b><div class="pips" id="pips"></div><button class="x" id="dClose" aria-label="關閉">×</button></div>
    <div class="body" id="dBody"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="js/content.js"></script>
<script src="js/sound.js"></script>
<script src="js/world.js"></script>
<script src="js/app.js"></script>
</body>
</html>
